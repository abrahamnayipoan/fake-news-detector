<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <!-- Mobile responsive fix -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fake News Detection System</title>

    <!-- CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Fake News Detection System</h1>

        <p>Paste a news article below and check if it is REAL or FAKE</p>

        <!-- Input box -->
        <textarea id="newsInput" placeholder="Enter news text here..."></textarea>

        <br><br>

        <!-- Button -->
        <button onclick="predictNews()">Check News</button>

        <!-- Result display -->
        <h2 id="result">Result will appear here</h2>

    </div>

    <!-- JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
