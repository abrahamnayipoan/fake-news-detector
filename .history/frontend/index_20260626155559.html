<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detection AI</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>Fake News Detection System</h1>

        <p>Paste a news article below to check if it is real or fake.</p>

        <textarea id="newsInput" placeholder="Enter or paste news here..."></textarea>

        <br>

        <button onclick="predictNews()">Analyze News</button>

        <h2 id="result"></h2>
    </div>

    <div class="container">
        <h1>Latest News Auto Prediction</h1>

        <p>Click the button below to fetch latest news and predict automatically.</p>

        <button onclick="loadLatestNews()">Load Latest News</button>

        <div id="latestNewsResult" class="news-grid"></div>
    </div>

    <div class="container">
        <h1>Upload News Image</h1>

        <p>Upload a screenshot or image that contains news text.</p>

        <input type="file" id="imageInput" accept="image/*">

        <br><br>

        <img id="previewImage" class="preview-image" alt="Uploaded preview">

        <br>

        <button onclick="predictImageNews()">Analyze Image</button>

        <h2 id="imageResult"></h2>

        <div id="extractedTextBox"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
